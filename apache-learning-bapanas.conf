# Serve Moodle at /learning-bapanas using only its public directory.
<IfModule mpm_winnt_module>
    ThreadStackSize 8388608
</IfModule>

Alias "/learning-bapanas" "C:/xampp/htdocs/learning-bapanas/public"

<Directory "C:/xampp/htdocs/learning-bapanas/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
</Directory>
